[workspace]
resolver = "2"
members = [
    "mesodb-core",
    "mesodb-server",
    "mesodb-cli"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["yeajustmars"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mesodb-core = { path = "mesodb-core", version = "0.1.0" }

# Storage & Engine
arrow = "58.2.0"
ahash = "0.8.12"
chrono = "0.4.44"

# Async & Web
tokio = { version = "1.52.2", features = ["full"] }
axum = "0.8.9"

# Observability & Errors
thiserror = "2.0.18"
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
